name: Prepare UIDOMHOME for Vercel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch production build to standard Next.js
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path('package.json')
          data = json.loads(package.read_text())
          scripts = data.setdefault('scripts', {})
          scripts.setdefault('dev:sites', scripts.get('dev', ''))
          scripts.setdefault('build:sites', scripts.get('build', ''))
          scripts.setdefault('start:sites', scripts.get('start', ''))
          scripts['dev'] = 'next dev'
          scripts['build'] = 'next build'
          scripts['start'] = 'next start'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lead = Path('app/api/crm/lead/route.ts')
          s = lead.read_text()
          s = s.replace('import { env } from "cloudflare:workers";\n\n', '')
          s = s.replace(
              '  const runtimeEnv = env as unknown as Record<string, string | undefined>;\n  const raw = runtimeEnv.BITRIX24_WEBHOOK_URL?.trim();',
              '  const raw = process.env.BITRIX24_WEBHOOK_URL?.trim();',
          )
          lead.write_text(s)

          status = Path('app/api/crm/status/route.ts')
          s = status.read_text()
          s = s.replace('import { env } from "cloudflare:workers";\n\n', '')
          s = s.replace(
              '  const runtimeEnv = env as unknown as Record<string, string | undefined>;\n  const enabled = Boolean(runtimeEnv.BITRIX24_WEBHOOK_URL?.trim());',
              '  const enabled = Boolean(process.env.BITRIX24_WEBHOOK_URL?.trim());',
          )
          status.write_text(s)
          PY

          grep -q '"build": "next build"' package.json
          ! grep -R -q 'cloudflare:workers' app/api/crm

      - name: Commit Vercel compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json app/api/crm/lead/route.ts app/api/crm/status/route.ts
          git commit -m "Make UIDOMHOME compatible with Vercel Next.js"
          git push origin HEAD:main
